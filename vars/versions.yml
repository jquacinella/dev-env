---
# Tool version variables for dev-setup.yml
# Update these versions as needed to control which versions are installed

# FZF - fuzzy finder
fzf_version: "v0.72.0"

# UP - Ultimate Plumber - tool for building command pipelines interactively
up_version: "v0.4"

# Ripgrep - fast grep alternative
ripgrep_version: "15.1.0"

# fd - fast find alternative
fd_version: "v10.4.2"

# watchexec - watches paths and runs commands on file modifications
watchexec_version: "v2.5.1"

# Espanso - text expander
espanso_version: "v2.3.0"

# Dust - du alternative
dust_version: "v1.2.4"

# xh - HTTPie-like HTTP client
xh_version: "v0.25.3"

# Broot - directory tree viewer
broot_version: "1.56.4"

# Procs - ps alternative
procs_version: "v0.14.11"

# Bottom - system monitor (btm)
bottom_version: "0.12.3"

# Zellij - terminal workspace manager
zellij_version: "v0.44.3"

# Gping - ping with a graph
gping_version: "gping-v1.20.1"

# Bandwhich - network utilization monitor
bandwhich_version: "v0.23.1"

# Bat - cat alternative with syntax highlighting
bat_version: "v0.26.1"

# Hexyl - hex viewer for the terminal
hexyl_version: "v0.17.0"

# Helix - post-modern modal text editor
helix_version: "25.07.1"

# Eza - modern replacement for ls
eza_version: "v0.23.4"

# LSD - LSDeluxe - next gen ls command
lsd_version: "v1.2.0"

# Zoxide - smarter cd command that learns your habits
zoxide_version: "0.9.9"

# Atuin - magical shell history
atuin_version: "v18.16.1"

# GitUI - blazing fast terminal UI for git
gitui_version: "v0.28.1"

# Lazygit - simple terminal UI for git commands
lazygit_version: "v0.61.1"

# Lazysql - terminal UI for database management
lazysql_version: "v0.5.0"

# Slumber - terminal-based HTTP/REST client
slumber_version: "v5.3.0"

# Asciinema - terminal session recorder
asciinema_version: "v3.2.0"

# Navi - interactive cheatsheet tool for the command-line
navi_version: "v2.24.0"

# SSH-List - tool for managing SSH connections
ssh_list_version: "v1.5.1"

# TLDR - simplified and community-driven man pages (tealdeer client)
# Note: tealdeer's latest upstream release is v1.8.1; there is no v2.x (prior v2.3.0 pin was invalid and 404'd)
tldr_version: "v1.8.1"

# NVM - Node Version Manager
nvm_version: "v0.40.4"
# Podman - container engine (installed from Ubuntu repositories, version depends on Ubuntu version)
# Note: Podman is not pinned to a specific version as it's installed via apt from official repos
# Update with: sudo apt update && sudo apt upgrade podman

# Podman-TUI - Terminal UI for Podman
podman_tui_version: "v1.11.1"

# Distrobox - Use any Linux distribution inside your terminal
distrobox_version: "1.8.2.5"

# Zide - Terminal-based IDE combining Zellij with file pickers and editors
zide_version: "v3.2.0"

# Yazi - blazing fast terminal file manager
yazi_version: "v26.5.6"

# RustNet - network monitoring TUI with deep packet inspection
rustnet_version: "v1.6.0"

# ast-grep - structural code search, lint, and rewriting tool
ast_grep_version: "0.45.2"

# Glow - markdown renderer for the terminal
glow_version: "v3.0.0"

# Hyperfine - command-line benchmarking tool
hyperfine_version: "v1.20.0"

# Duf - disk usage/free utility, a better df
duf_version: "v0.8.1"

# Oh-My-Zsh Plugins and Themes
zsh_autosuggestions_version: "v0.7.1"
zsh_syntax_highlighting_version: "0.8.0"
zsh_history_substring_search_version: "v1.1.0"
zsh_fzf_history_search_version: "master"
zsh_completions_version: "0.36.0"
spaceship_prompt_version: "v4.22.2"
