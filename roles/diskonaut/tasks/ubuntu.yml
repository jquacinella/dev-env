---
- name: Check if diskonaut is installed
  tags: ['diskonaut']
  stat:
    path: /usr/local/bin/diskonaut
  register: diskonaut_stat

- name: Download and install diskonaut
  tags: ['diskonaut']
  block:
    - name: Create temporary directory for diskonaut
      tempfile:
        state: directory
      register: diskonaut_temp

    - name: Download diskonaut tarball
      get_url:
        url: "https://github.com/imsnif/diskonaut/releases/download/{{ diskonaut_version }}/diskonaut-{{ diskonaut_version }}-unknown-linux-musl.tar.gz"
        dest: "{{ diskonaut_temp.path }}/diskonaut.tar.gz"

    - name: Extract diskonaut tarball
      unarchive:
        src: "{{ diskonaut_temp.path }}/diskonaut.tar.gz"
        dest: "{{ diskonaut_temp.path }}"
        remote_src: yes

    - name: Find diskonaut binary in extracted directory
      find:
        paths: "{{ diskonaut_temp.path }}"
        patterns: "diskonaut"
        recurse: yes
        file_type: file
      register: diskonaut_binary

    - name: Install diskonaut to /usr/local/bin
      copy:
        src: "{{ diskonaut_binary.files[0].path }}"
        dest: /usr/local/bin/diskonaut
        mode: '0755'
        remote_src: yes

    - name: Clean up diskonaut temporary directory
      file:
        path: "{{ diskonaut_temp.path }}"
        state: absent
  when: not diskonaut_stat.stat.exists or (force_update | default(false) | bool)
